# =====================================================================
# spark-defaults.conf — identical on master, worker1, worker2
# Installed to $SPARK_HOME/conf/ by scripts/04_install_configs.sh
# Sized for 3 x 16 GB laptops, 4 Spark cores each (see README §2 for 8/32 GB).
# =====================================================================

# ---------------- Cluster manager: Spark Standalone ----------------
spark.master                                     spark://master:7077
spark.driver.memory                              1g
spark.executor.memory                            1400m
spark.executor.cores                             2
# 3 workers x 4 cores = 12 cores -> up to 6 executors of 2 cores.
# The scalability experiment (Phase 4) limits cores per run with
# spark-submit --total-executor-cores N.

# ---------------- Parallelism & SQL ----------------
spark.default.parallelism                        24
spark.sql.shuffle.partitions                     48
spark.sql.adaptive.enabled                       true
spark.sql.adaptive.coalescePartitions.enabled    true
# One input split per HDFS block (128 MB), so read tasks map 1:1 to blocks.
spark.sql.files.maxPartitionBytes                134217728
spark.sql.session.timeZone                       UTC
spark.serializer                                 org.apache.spark.serializer.KryoSerializer
# Laptops on Wi-Fi: tolerate short network hiccups.
spark.network.timeout                            300s

# ---------------- HDFS ----------------
spark.hadoop.fs.defaultFS                        hdfs://master:9000

# ---------------- Event logs + History Server (evidence for the report) ----------------
spark.eventLog.enabled                           true
spark.eventLog.dir                               hdfs://master:9000/spark-logs
spark.history.fs.logDirectory                    hdfs://master:9000/spark-logs
spark.history.ui.port                            18080

# ---------------- Apache Iceberg: HadoopCatalog on HDFS ----------------
# Catalog name "lake"; tables are addressed as lake.<layer>.<table>,
# e.g. lake.bronze.events, lake.silver.events_clean, lake.gold.funnel_daily.
# Warehouse layout on HDFS: /warehouse/iceberg/<namespace>/<table>/{data,metadata}
spark.sql.extensions                             org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                           org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                      hadoop
spark.sql.catalog.lake.warehouse                 hdfs://master:9000/warehouse/iceberg
spark.sql.catalog.lake.table-default.format-version                 2
spark.sql.catalog.lake.table-default.write.parquet.compression-codec zstd

# The Iceberg runtime jar is copied into $SPARK_HOME/jars on every node by
# 04_install_configs.sh (works offline). If you prefer Maven download instead,
# remove the jar and uncomment ONE line that matches your Spark/Scala version:
# spark.jars.packages  org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.10.0
# spark.jars.packages  org.apache.iceberg:iceberg-spark-runtime-4.0_2.13:1.10.0

spark.executorEnv.JAVA_HOME        /usr/lib/jvm/java-17-openjdk-amd64
spark.yarn.appMasterEnv.JAVA_HOME  /usr/lib/jvm/java-17-openjdk-amd64
